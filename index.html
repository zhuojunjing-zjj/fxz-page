<!DOCTYPE html>
<html lang=`zh-CN`>
<head>
    <meta charset=`UTF-8`>
    <meta name=`viewport` content=`width=device-width, initial-scale=1.0`>
    <title>FXZ - 杞欢鍒嗕韩</title>
    <link href=`https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css` rel=`stylesheet`>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

        .navbar { backdrop-filter: blur(10px); background: rgba(255,255,255,0.85); border-bottom: 1px solid rgba(0,0,0,0.06); padding: 4px 0; }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 20px 0; text-align: center;
        }
        .hero .container { max-width: none; }

        .hero-blocks {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            gap: 20px;
        }

        .hero-left   { display: flex; align-items: center; justify-content: center; }
        .hero-mid    { text-align: center; }
        .hero-right  { text-align: center; white-space: nowrap; }

        .hero-mid > * + * { margin-top: 6px; }
        .hero-right > * + * { margin-top: 6px; }

        .hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.5px; margin: 0; }

        .desc-text { font-size: 1.15rem; opacity: 0.9; max-width: 600px; margin: 10px auto 0; line-height: 1.5; }

        .date-box { color: #fbbf24; }
        .date-box .ymd { font-size: 2.8rem; font-weight: 600; white-space: nowrap; }
        .date-box .dow  { font-size: 2.0rem; font-weight: 800; }
        .date-box .hms  { font-size: 2.8rem; font-weight: 800; }

        .txt-row { white-space: nowrap; }

        @media (max-width: 992px) {
            .hero-left, .hero-right { display: none; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<nav class=`navbar navbar-expand-lg sticky-top`>
    <div class=`container d-flex justify-content-center`></div>
</nav>

<section class=`hero`>
    <div class=`container`>

        <div class=`hero-blocks`>

            <!-- 宸﹀潡锛氭椂閽?-->
            <div class=`hero-left`>
                <canvas id=`clock-canvas` width=`170` height=`170`></canvas>
            </div>

            <!-- 涓潡锛氭爣棰樼粍 -->
            <div class=`hero-mid`>
                <div class=`txt-row`>
                    <span style=`color:#fbbf24;font-size:2.8rem;font-weight:800;`>FXZ</span><span style=`color:#e879f9;font-size:2.8rem;font-weight:800;`>路</span><span style=`color:#34d399;font-size:2.8rem;font-weight:800;`>鍒?/span><span style=`color:#fb923c;font-size:2.8rem;font-weight:800;`>浜?/span><span style=`color:#a78bfa;font-size:2.8rem;font-weight:800;`>绔?/span>
                </div>
                <div class=`txt-row` style=`font-size:2.0rem;font-weight:700;`>
                    <span style=`color:#fbbf24;`>H</span><span style=`color:#f472b6;`>T</span><span style=`color:#a78bfa;`>T</span><span style=`color:#34d399;`>P</span><span style=`color:#f97316;`>S</span><span style=`color:#94a3b8;`>://</span><span style=`color:#fbbf24;`>F</span><span style=`color:#f472b6;`>X</span><span style=`color:#a78bfa;`>Z</span><span style=`color:#fbbf24;`>.</span><span style=`color:#f472b6;`>C</span><span style=`color:#a78bfa;`>C</span><span style=`color:#34d399;`>.</span><span style=`color:#f97316;`>C</span><span style=`color:#fbbf24;`>D</span>
                </div>
                <h1>
                    <span style=`color:#fbbf24;`>瀹炵敤</span><span style=`color:#f472b6;`>杞欢</span>
                    <span style=`color:#a78bfa;`> 路 </span>
                    <span style=`color:#34d399;`>鍏嶈垂</span><span style=`color:#f97316;`>鍒嗕韩</span>
                </h1>
                <p class=`desc-text`>
                    <span style=`color:#fbbf24;`>闄即</span><span style=`color:#f472b6;`>鎵€鏈?/span><span style=`color:#38bdf8;`>鐢佃剳</span><span style=`color:#a78bfa;`>浣跨敤鑰?/span><span style=`color:#34d399;`>搴﹁繃</span><span style=`color:#fb923c;`>缇庡ソ</span><span style=`color:#e879f9;`>鐨?/span><span style=`color:#fbbf24;`>姣忎竴澶?/span><span style=`color:#94a3b8;`>锛?/span><span style=`color:#f472b6;`>鎵€鏈?/span><span style=`color:#38bdf8;`>杞欢</span><span style=`color:#a78bfa;`>鍧?/span><span style=`color:#34d399;`>缁忚繃</span><span style=`color:#fb923c;`>瀹炴祴</span><span style=`color:#fbbf24;`>锛?/span><span style=`color:#f472b6;`>瀹夊叏</span><span style=`color:#38bdf8;`>鍙潬</span>
                </p>
            </div>

            <!-- 鍙冲潡锛氭棩鏈熺粍 -->
            <div class=`hero-right`>
                <div class=`date-box`><div class=`ymd` id=`date-ymd`></div></div>
                <div class=`date-box`><div class=`dow` id=`date-dow`></div></div>
                <div class=`date-box`><div class=`hms` id=`date-hms`></div></div>
            </div>

        </div>

    </div>
</section>

<script>
(function() {
    const canvas = document.getElementById('clock-canvas');
    const ctx = canvas.getContext('2d');
    const r = 80, cx = 85, cy = 85;

    function drawClock() {
        ctx.clearRect(0, 0, 170, 170);
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 6; ctx.stroke();
        for (let i = 0; i < 12; i++) {
            const ang = (i * 30 - 90) * Math.PI / 180;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(ang) * (r - 7), cy + Math.sin(ang) * (r - 7));
            ctx.lineTo(cx + Math.cos(ang) * (r - 2), cy + Math.sin(ang) * (r - 2));
            ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 5; ctx.stroke();
        }
        const now = new Date();
        const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds();
        drawHand(((h + m / 60) * 30 - 90) * Math.PI / 180, r * 0.5, 7, '#fbbf24');
        drawHand(((m + s / 60) * 6 - 90) * Math.PI / 180, r * 0.7, 6, '#fbbf24');
        drawHand((s * 6 - 90) * Math.PI / 180, r * 0.8, 3, '#fbbf24');
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24'; ctx.fill();
    }

    function drawHand(angle, len, w, color) {
        ctx.beginPath();
        ctx.lineWidth = w; ctx.strokeStyle = color;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
        ctx.stroke();
    }

    setInterval(drawClock, 1000);
    drawClock();
})();

(function() {
    const weekNames = ['鏄熸湡鏃?, '鏄熸湡涓€', '鏄熸湡浜?, '鏄熸湡涓?, '鏄熸湡鍥?, '鏄熸湡浜?, '鏄熸湡鍏?];
    function update() {
        const now = new Date();
        document.getElementById('date-ymd').textContent = now.getFullYear() + '骞? + (now.getMonth()+1) + '鏈? + now.getDate() + '鏃?;
        document.getElementById('date-dow').textContent = weekNames[now.getDay()];
        document.getElementById('date-hms').textContent = String(now.getHours()).padStart(2,'0') + '锛? + String(now.getMinutes()).padStart(2,'0') + '锛? + String(now.getSeconds()).padStart(2,'0');
    }
    setInterval(update, 1000);
    update();
})();
</script>

</body>
</html>
