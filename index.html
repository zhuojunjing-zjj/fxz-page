<!DOCTYPE html>
<html lang=zh-CN>
<head>
    <meta charset=UTF-8>
    <meta name=viewport content=width=device-width, initial-scale=1.0>
    <title>FXZ - 软件分享</title>
    <link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css rel=stylesheet>
    <link href=https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css rel=stylesheet>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        /* Hero */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; padding: 80px 0 60px; text-align: center;
        }
        .hero h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .hero p { font-size: 1.15rem; opacity: 0.9; max-width: 480px; margin: 16px auto 0; line-height: 1.8; }
        
        /* Nav */
        .navbar { backdrop-filter: blur(10px); background: rgba(255,255,255,0.85); border-bottom: 1px solid rgba(0,0,0,0.06); padding: 4px 0; }
        .navbar-brand-group { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.navbar-brand-group .brand-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
.navbar-brand-group .brand-main { font-weight: 800; color: var(--primary); font-size: 2.0rem; }
.navbar-brand-group .brand-sub { font-size: 2.0rem !important; color: #1e293b; line-height: 1; font-weight: 700; }
.navbar-brand-group .brand-url { font-size: 2.0rem; color: #1e293b; font-weight: 700; }
.navbar-brand-group .brand-slogan { font-size: 2.0rem; color: #1e293b; font-weight: 700; display: block; }
        
        /* Cards */
        .section-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
        .section-sub { color: var(--text-muted); margin-bottom: 32px; }
        
        .software-card {
            background: var(--card-bg); border: none;
            border-radius: 16px; padding: 24px; transition: all 0.25s;
            display: flex; gap: 20px; align-items: flex-start;
        }
        .software-card:hover {
            transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            border-color: rgba(99,102,241,0.2);
        }
        .software-icon {
            width: 56px; height: 56px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #fff; flex-shrink: 0;
        }
        .software-info { flex: 1; }
        .software-info h3 { font-size: 1.15rem; font-weight: 700; margin: 0 0 6px; }
        .software-info .desc { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 10px; line-height: 1.5; }
        .badge-tag { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; margin-right: 6px; }
        .btn-download {
            background: var(--primary); color: #fff; border: none;
            border-radius: 10px; padding: 8px 20px; font-weight: 600;
            font-size: 0.9rem; transition: all 0.2s; white-space: nowrap;
        }
        .btn-download:hover { background: var(--primary-dark); color: #fff; transform: scale(1.03); }
        
        /* Footer */
        .footer {
            text-align: center; padding: 32px 0; color: var(--text-muted);
            font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.06); margin-top: 60px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2rem; }
            .hero { padding: 60px 0 40px; }
            .software-card { flex-direction: column; text-align: center; align-items: center; }
            .btn-download { width: 100%; }
        }
    </style>
</head>
<body>

<!-- Nav -->
<nav class=navbar navbar-expand-lg sticky-top>
    <div class=container d-flex justify-content-center>
        <div class=navbar-brand-group>
            <div class=brand-row>
                <span class=brand-main>FXZ</span>
                <span class=brand-sub>分享站</span>
            </div>
            <span class=brand-url>HTTPS://FXZ.CC.CD</span>
            <span class=brand-slogan>陪伴所有电脑使用者度过美好的每一天</span>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class=hero>
    <div class=container>
        <h1>实用软件 · 免费分享</h1>
        <p>精选高效工具，提升你的工作与生活效率。所有软件均经过实测，安全可靠。</p>
    </div>
</section>

</body>
</html>
